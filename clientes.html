<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amêndola &amp; Amêndola - Clientes</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/clientes.css?v=20260717">
  <link rel="stylesheet" href="assets/css/cookies.css?v=20260709">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/img/logo-amendola-2.png">
    <link rel="apple-touch-icon" href="assets/img/logo-amendola-2.png">
</head>

<body class="clientes-page">
  <div id="navbar"></div>

  <main>
    <section class="clientes-section">
      <div class="container">
        <div class="clientes-header" data-sr>
          <span class="badge"><i class="fa-solid fa-building-user"></i> Portal de acesso</span>
          <h2>Clientes Amêndola</h2>
          <p>Acesse rapidamente os sistemas de cada prefeitura e entidade: FlowDocs, ISS, Serviços, Transparência, Holerite, SCPI e mais.</p>
        </div>

        <div class="clientes-toolbar">
          <label class="clientes-search" for="clienteSearch">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="clienteSearch" placeholder="Buscar por nome, site ou CNPJ..." autocomplete="off">
          </label>
          <span class="clientes-count"><strong id="cliCount">0</strong> de <span id="cliTotal">0</span> clientes</span>
        </div>

        <div class="clientes-grid" id="clientesGrid"></div>

        <p class="clientes-empty" id="clientesLoading">
          <i class="fa-solid fa-spinner fa-spin"></i> Carregando clientes...
        </p>

        <p class="clientes-empty" id="clientesEmpty" hidden>
          <i class="fa-solid fa-magnifying-glass-minus"></i> Nenhum cliente encontrado.
        </p>
      </div>
    </section>
  </main>

  <div id="footer-area"></div>
  <div id="cookies-area"></div>

  <a href="https://wa.me/551735579090" class="whatsapp-btn" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-whatsapp"></i></a>
  <button id="back-to-top" aria-label="Voltar ao topo">&#8593;</button>

  <script src="assets/components/loader.js?v=20260901"></script>
  <script src="assets/js/cookies.js"></script>
  <script src="assets/js/scroll-reveal.js"></script>

  <script type="module" src="assets/js/clientes.js?v=20260915"></script>

  <script>
    (function () {
      var btn = document.getElementById("back-to-top");
      window.addEventListener("scroll", function () {
        btn.classList.toggle("visible", window.scrollY > 400);
      });
      btn.addEventListener("click", function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    })();
  </script>
</body>

</html>
